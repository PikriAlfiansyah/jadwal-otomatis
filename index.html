<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Otomatis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .kegiatan {
      border-left: 4px solid #4CAF50;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #f4f4f4;
      position: relative;
    }
    .bentrok {
      border-left-color: red;
      background: #ffe6e6;
    }
    .tombol-aksi {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .tombol-aksi button {
      padding: 4px 10px;
      font-size: 13px;
    }
    .btn-hapus {
      background: #e74c3c;
    }
    .btn-edit {
      background: #3498db;
    }
  </style>
</head>
<body>

  <h1>Jadwal Harianku</h1>

  <form id="formKegiatan">
    <input type="text" id="namaKegiatan" placeholder="Nama kegiatan" required>
    <input type="date" id="tanggal" required>
    <input type="time" id="jamMulai" required>
    <input type="time" id="jamSelesai" required>
    <button type="submit" id="tombolSubmit">Tambah Kegiatan</button>
  </form>

  <h2>Daftar Kegiatan</h2>
  <div id="hasilJadwal"></div>

  <script>
    const form = document.getElementById('formKegiatan');
    const hasilDiv = document.getElementById('hasilJadwal');
    const tombolSubmit = document.getElementById('tombolSubmit');

    let daftarKegiatan = JSON.parse(localStorage.getItem('kegiatan')) || [];

    // Menyimpan id kegiatan yang lagi diedit (null = mode tambah baru)
    let sedangEdit = null;

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const jamMulai = document.getElementById('jamMulai').value;
      const jamSelesai = document.getElementById('jamSelesai').value;

      if (jamSelesai <= jamMulai) {
        alert('Jam selesai harus lebih besar dari jam mulai!');
        return;
      }

      const dataForm = {
        nama: document.getElementById('namaKegiatan').value,
        tanggal: document.getElementById('tanggal').value,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai
      };

      if (sedangEdit === null) {
        // MODE TAMBAH: kasih id unik pakai waktu sekarang
        dataForm.id = Date.now();
        daftarKegiatan.push(dataForm);
      } else {
        // MODE EDIT: cari kegiatan yang id-nya cocok, timpa datanya
        const index = daftarKegiatan.findIndex(k => k.id === sedangEdit);
        dataForm.id = sedangEdit; // id tetap sama, cuma datanya diupdate
        daftarKegiatan[index] = dataForm;
        sedangEdit = null; // selesai edit, balik ke mode tambah
        tombolSubmit.textContent = 'Tambah Kegiatan';
      }

      localStorage.setItem('kegiatan', JSON.stringify(daftarKegiatan));
      form.reset();
      tampilkanJadwal();
    });

    function hapusKegiatan(id) {
      const konfirmasi = confirm('Yakin mau hapus kegiatan ini?');
      if (!konfirmasi) return;

      daftarKegiatan = daftarKegiatan.filter(k => k.id !== id);
      localStorage.setItem('kegiatan', JSON.stringify(daftarKegiatan));
      tampilkanJadwal();
    }

    function editKegiatan(id) {
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;

      document.getElementById('namaKegiatan').value = keg.nama;
      document.getElementById('tanggal').value = keg.tanggal;
      document.getElementById('jamMulai').value = keg.jamMulai;
      document.getElementById('jamSelesai').value = keg.jamSelesai;

      sedangEdit = id;
      tombolSubmit.textContent = 'Simpan Perubahan';

      window.scrollTo(0, 0); // scroll ke atas biar user lihat form
    }

    function tampilkanJadwal() {
      const terurut = [...daftarKegiatan].sort((a, b) => {
        if (a.tanggal !== b.tanggal) return a.tanggal.localeCompare(b.tanggal);
        return a.jamMulai.localeCompare(b.jamMulai);
      });

      hasilDiv.innerHTML = '';

      terurut.forEach((keg, index) => {
        let bentrok = false;
        if (index > 0) {
          const sebelumnya = terurut[index - 1];
          if (sebelumnya.tanggal === keg.tanggal && keg.jamMulai < sebelumnya.jamSelesai) {
            bentrok = true;
          }
        }

        const div = document.createElement('div');
        div.className = 'kegiatan' + (bentrok ? ' bentrok' : '');
        div.innerHTML = `
          <strong>${keg.nama}</strong><br>
          ${keg.tanggal} | ${keg.jamMulai} - ${keg.jamSelesai}
          ${bentrok ? '<br>⚠️ Bentrok dengan kegiatan sebelumnya!' : ''}
          <div class="tombol-aksi">
            <button class="btn-edit" onclick="editKegiatan(${keg.id})">Edit</button>
            <button class="btn-hapus" onclick="hapusKegiatan(${keg.id})">Hapus</button>
          </div>
        `;
        hasilDiv.appendChild(div);
      });
    }

    tampilkanJadwal();
  </script>

</body>
</html>
