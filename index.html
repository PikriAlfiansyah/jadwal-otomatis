<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Otomatis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .kegiatan {
      border-left: 4px solid #4CAF50;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #f4f4f4;
    }
    .bentrok {
      border-left-color: red;
      background: #ffe6e6;
    }
    .tombol-aksi {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }
    .tombol-aksi button {
      padding: 4px 10px;
      font-size: 13px;
    }
    .btn-hapus {
      background: #e74c3c;
    }
    .btn-edit {
      background: #3498db;
    }
  </style>
</head>
<body>

  <h1>Jadwal Harianku</h1>

  <form id="formKegiatan">
    <input type="text" id="namaKegiatan" placeholder="Nama kegiatan" required>
    <input type="date" id="tanggal" required>
    <input type="time" id="jamMulai" required>
    <input type="time" id="jamSelesai" required>
    <button type="submit" id="tombolSubmit">Tambah Kegiatan</button>
  </form>

  <h2>Daftar Kegiatan</h2>
  <div id="hasilJadwal"><p>Memuat data...</p></div>

  <!-- SDK Firebase (versi "compat" biar gampang dipakai tanpa build tools) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // 1. Konfigurasi & inisialisasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDrnuoOBpdtFtp1Vy52pp28Web-NK-wA7M",
      authDomain: "jadwal-otomatis-954b7.firebaseapp.com",
      projectId: "jadwal-otomatis-954b7",
      storageBucket: "jadwal-otomatis-954b7.firebasestorage.app",
      messagingSenderId: "325470252976",
      appId: "1:325470252976:web:d442365eba2b6e354b7075"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const kegiatanRef = db.collection('kegiatan');

    const form = document.getElementById('formKegiatan');
    const hasilDiv = document.getElementById('hasilJadwal');
    const tombolSubmit = document.getElementById('tombolSubmit');

    let daftarKegiatan = []; // sekarang cuma "cache" sementara, sumber aslinya di Firestore
    let sedangEdit = null;   // id dokumen Firestore yang lagi diedit

    // 2. "Dengerin" perubahan data di Firestore secara real-time
    kegiatanRef.onSnapshot((snapshot) => {
      daftarKegiatan = snapshot.docs.map(doc => ({
        id: doc.id,       // id otomatis dari Firestore
        ...doc.data()     // isi field nama, tanggal, jamMulai, jamSelesai
      }));
      tampilkanJadwal();
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const jamMulai = document.getElementById('jamMulai').value;
      const jamSelesai = document.getElementById('jamSelesai').value;

      if (jamSelesai <= jamMulai) {
        alert('Jam selesai harus lebih besar dari jam mulai!');
        return;
      }

      const dataForm = {
        nama: document.getElementById('namaKegiatan').value,
        tanggal: document.getElementById('tanggal').value,
        jamMulai: jamMulai,
        jamSelesai: jamSelesai
      };

      if (sedangEdit === null) {
        // MODE TAMBAH: kirim data baru ke Firestore
        kegiatanRef.add(dataForm);
      } else {
        // MODE EDIT: update dokumen yang id-nya cocok
        kegiatanRef.doc(sedangEdit).update(dataForm);
        sedangEdit = null;
        tombolSubmit.textContent = 'Tambah Kegiatan';
      }

      form.reset();
      // Gak perlu panggil tampilkanJadwal() manual di sini,
      // karena onSnapshot di atas otomatis jalan tiap ada perubahan data
    });

    function hapusKegiatan(id) {
      const konfirmasi = confirm('Yakin mau hapus kegiatan ini?');
      if (!konfirmasi) return;

      kegiatanRef.doc(id).delete();
    }

    function editKegiatan(id) {
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;

      document.getElementById('namaKegiatan').value = keg.nama;
      document.getElementById('tanggal').value = keg.tanggal;
      document.getElementById('jamMulai').value = keg.jamMulai;
      document.getElementById('jamSelesai').value = keg.jamSelesai;

      sedangEdit = id;
      tombolSubmit.textContent = 'Simpan Perubahan';

      window.scrollTo(0, 0);
    }

    function tampilkanJadwal() {
      const terurut = [...daftarKegiatan].sort((a, b) => {
        if (a.tanggal !== b.tanggal) return a.tanggal.localeCompare(b.tanggal);
        return a.jamMulai.localeCompare(b.jamMulai);
      });

      hasilDiv.innerHTML = '';

      if (terurut.length === 0) {
        hasilDiv.innerHTML = '<p>Belum ada kegiatan.</p>';
        return;
      }

      terurut.forEach((keg, index) => {
        let bentrok = false;
        if (index > 0) {
          const sebelumnya = terurut[index - 1];
          if (sebelumnya.tanggal === keg.tanggal && keg.jamMulai < sebelumnya.jamSelesai) {
            bentrok = true;
          }
        }

        const div = document.createElement('div');
        div.className = 'kegiatan' + (bentrok ? ' bentrok' : '');
        div.innerHTML = `
          <strong>${keg.nama}</strong><br>
          ${keg.tanggal} | ${keg.jamMulai} - ${keg.jamSelesai}
          ${bentrok ? '<br>⚠️ Bentrok dengan kegiatan sebelumnya!' : ''}
          <div class="tombol-aksi">
            <button class="btn-edit" onclick="editKegiatan('${keg.id}')">Edit</button>
            <button class="btn-hapus" onclick="hapusKegiatan('${keg.id}')">Hapus</button>
          </div>
        `;
        hasilDiv.appendChild(div);
      });
    }
  </script>

</body>
</html>
