<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Otomatis</title>
  <meta name="theme-color" content="#0b0f1a">
  <meta name="description" content="Atur jadwal harian otomatis dengan timeline, prioritas, dan pengingat.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f1a; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.10);
      --teks: #e8ecf5; --redup: #9aa2b6; --aksen: #7c5cff; --aksen2: #00d4ff; --bahaya: #ff5d73;
      --sukses: #34d399;
      --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
      --bayang-1: 0 2px 10px rgba(0,0,0,.25);
      --bayang-2: 0 16px 40px rgba(0,0,0,.35);
      --bayang-3: 0 -10px 40px rgba(0,0,0,.55);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Arial, sans-serif;
      max-width: 520px; margin: 0 auto; padding: 24px 16px 70px;
      color: var(--teks); background: var(--bg); min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(600px 420px at 8% -5%, rgba(124,92,255,.38), transparent 60%),
        radial-gradient(520px 420px at 100% 12%, rgba(0,212,255,.22), transparent 60%),
        var(--bg);
    }

    /* ===== RESPONSIF ===== */
    /* Tampilan tetap satu kolom di semua ukuran layar (HP, tablet, laptop).
       Yang berubah cuma lebar kontainer dan sedikit jarak, supaya di layar
       lebar tidak terlalu sempit tapi juga tidak melebar berlebihan karena
       kontennya memang dirancang satu kolom (dipisah lewat tab, bukan
       kolom berdampingan). */
    @media (min-width: 600px) {
      body { max-width: 640px; padding: 32px 24px 80px; }
    }
    @media (min-width: 900px) {
      body { max-width: 680px; padding: 40px 24px 90px; }
    }

    h1 {
      font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; letter-spacing: -.5px; margin: 0 0 20px; text-align: center;
      background: linear-gradient(90deg, #fff, #b7a8ff 50%, #7fe6ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--redup); margin: 0 0 10px; font-weight: 700; }
    h2.judul-ke-2 { margin-top: 32px; }

    /* ===== TAB NAVIGASI (2 halaman/menu) ===== */
    .tab-nav {
      display: flex; gap: 6px; margin-bottom: 22px; padding: 6px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
      box-shadow: var(--bayang-1);
    }
    .tab-btn {
      flex: 1; padding: 12px 10px; font-size: 14px; font-weight: 700; border-radius: var(--r-md);
      background: transparent; color: var(--redup); box-shadow: none;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, color .15s;
    }
    .tab-btn:hover { color: var(--teks); filter: none; }
    .tab-btn.aktif { background: linear-gradient(135deg, var(--aksen), var(--aksen2)); color: #fff; box-shadow: 0 6px 16px rgba(124,92,255,.4); }
    .tab-btn.aktif:hover { color: #fff; }

    .halaman { display: none; }
    .halaman.aktif { display: block; }
    /* ===== akhir tab navigasi ===== */

    form, .grup { display: flex; flex-direction: column; gap: 10px; }
    form {
      margin-bottom: 24px; padding: 20px; border-radius: var(--r-lg);
      background: var(--card); border: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--bayang-2);
    }
    label { font-size: 12px; color: var(--redup); font-weight: 600; letter-spacing: .04em; }
    input, select {
      font: inherit; font-size: 15px; padding: 11px 13px; color: var(--teks);
      background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: var(--r-sm);
      outline: none; color-scheme: dark; transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus { border-color: var(--aksen); box-shadow: 0 0 0 3px rgba(124,92,255,.28); }
    select option { background: #151a2b; }
    button {
      font: inherit; font-size: 15px; font-weight: 700; padding: 12px; color: #fff; border: 0;
      border-radius: var(--r-sm); cursor: pointer;
      background: linear-gradient(135deg, var(--aksen), #4f8bff 60%, var(--aksen2));
      box-shadow: 0 8px 22px rgba(124,92,255,.35);
      transition: transform .15s, filter .15s;
    }
    button:hover { filter: brightness(1.12); }
    button:active { transform: scale(.97); }
    .info-jendela { font-size: 12px; color: var(--redup); margin: 0; line-height: 1.5; }

    .kotak-pengingat {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--bayang-1);
    }
    .kotak-pengingat .baris { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .kotak-pengingat select { flex: 1; min-width: 150px; }
    .toast-area { position: fixed; top: 10px; left: 0; right: 0; max-width: 500px; margin: 0 auto; padding: 0 12px; z-index: 20; pointer-events: none; }
    .toast {
      pointer-events: auto; padding: 13px 15px; border-radius: var(--r-md); margin-bottom: 8px; font-size: 14px;
      background: rgba(20,26,43,.92); border: 1px solid var(--line); color: #fff;
      backdrop-filter: blur(14px); box-shadow: var(--bayang-2);
    }

    .kepala { display: flex; align-items: center; justify-content: space-between; }
    .kepala b { font-size: 17px; text-transform: capitalize; font-weight: 700; }
    .btn-panah {
      width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 20px;
      background: var(--card); border: 1px solid var(--line); color: var(--teks); box-shadow: none;
    }
    .btn-panah:hover { background: rgba(255,255,255,.10); filter: none; }
    .strip {
      display: flex; gap: 4px; margin: 14px 0 18px; padding: 10px 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--bayang-1);
    }
    .hari {
      flex: 1; padding: 6px 0; border-radius: var(--r-md); background: none; box-shadow: none; color: var(--teks);
      display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .hari small { font-size: 10px; color: var(--redup); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    .hari b { width: 34px; height: 34px; line-height: 34px; border-radius: 50%; font-size: 14px; font-weight: 600; text-align: center; }
    .hari.ini b { box-shadow: inset 0 0 0 1.5px var(--aksen2); color: var(--aksen2); }
    .hari.pilih b { background: linear-gradient(135deg, var(--aksen), var(--aksen2)); color: #fff; box-shadow: 0 6px 16px rgba(124,92,255,.5); }
    .hari i { width: 5px; height: 5px; border-radius: 50%; }
    .hari i.titik { background: var(--aksen2); box-shadow: 0 0 6px var(--aksen2); }
    .baris-chip { display: flex; gap: 6px; margin-bottom: 14px; }
    .baris-chip .sp { flex: 1; }
    .chip {
      padding: 7px 15px; font-size: 13px; font-weight: 600; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--redup); box-shadow: none;
      transition: border-color .15s, color .15s, background .15s;
    }
    .chip:hover { border-color: rgba(255,255,255,.22); color: var(--teks); filter: none; }
    .chip.aktif { background: rgba(124,92,255,.22); border-color: var(--aksen); color: #fff; }
    .chip.aktif:hover { border-color: var(--aksen); color: #fff; }

    .legenda {
      display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--redup);
      margin-bottom: 16px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-md);
    }
    .legenda span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--warna); box-shadow: 0 0 8px var(--warna); vertical-align: middle; }
    .tanggal-judul { margin: 20px 0 10px; font-size: 15px; font-weight: 700; }

    .centang {
      flex: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 1.5px solid var(--redup); background: transparent; color: transparent;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      box-shadow: none; padding: 0; transition: all .15s;
    }
    .centang:hover { border-color: var(--sukses); filter: none; }
    .centang.terisi { background: var(--sukses); border-color: var(--sukses); color: #06281c; }
    .centang.lewat-belum { border-color: var(--bahaya); color: var(--bahaya); }
    .centang.lewat-belum::after { content: "!"; font-weight: 800; }

    .kegiatan {
      padding: 14px 16px; margin-bottom: 10px; border-radius: var(--r-md); line-height: 1.5;
      background: var(--card); border: 1px solid var(--line); border-left: 4px solid #7f8c8d;
      display: flex; gap: 12px; align-items: flex-start; box-shadow: var(--bayang-1);
    }
    .kegiatan.bentrok { background: rgba(255,93,115,.12); }
    .kegiatan.tidak-muat { background: rgba(255,184,0,.10); }
    .kegiatan.lewat { opacity: .55; }
    .isi-kartu { flex: 1; min-width: 0; }
    .judul-kartu { display: block; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .meta { display: inline-block; font-size: 12px; color: var(--redup); margin-top: 2px; }
    .label-otomatis { display: inline-block; font-size: 12px; color: var(--aksen2); margin-top: 2px; }
    .tombol-aksi { margin-top: 12px; display: flex; gap: 8px; }
    .tombol-aksi button { padding: 6px 14px; font-size: 13px; box-shadow: none; border-radius: var(--r-sm); }
    .btn-hapus { background: rgba(255,93,115,.9); }
    .btn-edit { background: rgba(79,139,255,.9); }

    .timeline { position: relative; margin: 16px 0 20px; }
    .garis { position: absolute; left: 48px; right: 0; border-top: 1px solid rgba(255,255,255,.08); }
    .garis.setengah { border-top: 1px dashed rgba(255,255,255,.04); }
    .garis span { position: absolute; left: -48px; width: 40px; text-align: right; top: -8px; font-size: 11px; font-weight: 600; color: var(--redup); }
    .garis.setengah span { display: none; }
    .kosong {
      position: absolute; left: 52px; right: 0; border: 1px dashed rgba(255,255,255,.14); border-radius: var(--r-md);
      color: #6b7385; font-size: 11px; display: flex; align-items: center; justify-content: center; z-index: 0;
    }

    /* ===== BLOK TIMELINE ===== */
    .blok {
      --tinta: #f4f6fb !important;
      position: absolute; padding: 6px 9px; border-radius: var(--r-sm); border-left: 4px solid;
      font-size: 12px; line-height: 1.35; cursor: pointer; z-index: 1;
      box-shadow: 0 4px 14px rgba(0,0,0,.35); backdrop-filter: blur(6px);
      transition: transform .15s, box-shadow .15s;
      min-height: 24px;
    }
    .blok:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.5); z-index: 2; }
    .blok:active { transform: scale(.98); }
    .blok .judul {
      font-weight: 700; font-size: 13px; color: var(--tinta);
      padding-right: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block;
    }
    .blok .jam {
      font-size: 11px; color: var(--tinta); opacity: .78;
      padding-right: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block;
    }
    .blok .pri { position: absolute; top: 8px; right: 30px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; z-index: 2; }
    .blok .centang { position: absolute; top: 4px; right: 4px; width: 19px; height: 19px; font-size: 11px; background: rgba(11,15,26,.7); z-index: 3; }
    .blok.tabrak { outline: 2px solid var(--bahaya); outline-offset: -2px; }
    .blok.pendek {
      display: flex; align-items: center; gap: 6px;
      padding-top: 0; padding-bottom: 0; padding-right: 40px;
    }
    .blok.pendek .judul { flex: 1; min-width: 0; padding-right: 0; }
    .blok.pendek .jam { flex: none; padding-right: 0; max-width: 46px; }
    .blok.lewat { opacity: .5; }
    /* ===== akhir blok timeline ===== */

    .sekarang { position: absolute; left: 48px; right: 0; border-top: 2px solid var(--bahaya); z-index: 3; box-shadow: 0 0 12px rgba(255,93,115,.7); }
    .sekarang::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--bahaya); }
    .sekarang span { position: absolute; left: -48px; top: -9px; background: var(--bahaya); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }

    .sheet-latar { display: none; position: fixed; inset: 0; background: rgba(5,8,16,.6); backdrop-filter: blur(4px); z-index: 10; }
    .sheet {
      display: none; position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
      background: #141a2b; border: 1px solid var(--line); border-bottom: 0; border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 22px 20px 26px; z-index: 11; box-shadow: var(--bayang-3);
    }
    .sheet.tampil, .sheet-latar.tampil { display: block; }
    .sheet .kepala-sheet { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sheet h3 { margin: 0 0 6px; font-size: 19px; }
    .sheet p { margin: 6px 0; font-size: 14px; color: #aab3c5; line-height: 1.5; }
    .sheet p b { color: #fff; font-size: 16px; }
    .sheet .titik-kat { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .sheet .tombol-aksi { margin-top: 18px; }
    .sheet .tombol-aksi button { padding: 10px 18px; font-size: 14px; border-radius: var(--r-sm); }
    .sheet .centang { width: 28px; height: 28px; font-size: 15px; }
    .btn-tutup { background: rgba(255,255,255,.10); box-shadow: none; }
    /* Modal Konfirmasi Hapus */
    .modal-hapus-latar {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,8,16,.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-hapus-latar.tampil {
      display: flex;
    }

    .modal-hapus {
      width: 100%;
      max-width: 380px;
      background: #141a2b;
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      padding: 24px 20px 20px;
      box-shadow: var(--bayang-2);
      text-align: center;
    }

    .modal-hapus-ikon {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,93,115,.12);
      font-size: 24px;
    }

    .modal-hapus h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .modal-hapus p {
      margin: 0;
      color: var(--redup);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-hapus-nama {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    .modal-hapus-aksi {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-hapus-aksi button {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      box-shadow: none;
    }

    .btn-batal-hapus {
      background: rgba(255,255,255,.10);
    }

    .btn-konfirmasi-hapus {
      background: rgba(255,93,115,.9);
    }
    @media (min-width: 900px) {
      .sheet { max-width: 560px; border-radius: var(--r-xl); bottom: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    }

    /* ===== POLESAN TAMBAHAN ===== */

/* Fokus keyboard yang jelas (aksesibilitas) */
:focus-visible { outline: 2px solid var(--aksen2); outline-offset: 2px; }
input:focus-visible, select:focus-visible { outline: none; }

/* Hormati pengguna yang mematikan animasi di perangkatnya */
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }

    /* Nyaman di layar sentuh */
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input::placeholder { color: #6b7385; }
    label { margin-top: 4px; }

    /* Sheet detail: bisa di-scroll di layar pendek, tombol tidak kepotong */
    .sheet {
      max-height: 85vh; overflow-y: auto;
      padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    }
    .sheet .tombol-aksi { flex-wrap: wrap; }

    /* Tombol varian */
    .btn-jadwal-ulang { background: rgba(0,212,255,.85); color: #04202b; }
    .btn-sukses { background: linear-gradient(135deg, #10b981, #34d399); color: #06281c; }
    .ikon-sukses { background: rgba(52,211,153,.14); }

    /* Animasi masuk yang halus */
    .halaman.aktif { animation: masuk .25s ease; }
    .sheet.tampil { animation: naik .25s ease; }
    .modal-hapus-latar.tampil .modal-hapus { animation: pop .2s ease; }
    @keyframes masuk { from { opacity: 0; transform: translateY(6px); } }
    @keyframes naik  { from { transform: translateY(24px); opacity: 0; } }
    @keyframes pop   { from { transform: scale(.96); opacity: 0; } }

    /* Layar sangat kecil */
    @media (max-width: 380px) {
      .tab-btn { font-size: 13px; padding: 10px 6px; }
      .hari b { width: 30px; height: 30px; line-height: 30px; }
    }

  </style>
</head>
<body>

  <h1>Jadwal Harianku</h1>

  <div class="tab-nav">
    <button type="button" class="tab-btn" id="btnHalTambah" onclick="gantiHalaman('tambah')">➕ Tambah Kegiatan</button>
    <button type="button" class="tab-btn aktif" id="btnHalKalender" aria-current="page" onclick="gantiHalaman('kalender')">📅 Kalender</button>
  </div>

  <main>
  <!-- ===== HALAMAN 1: TAMBAH KEGIATAN ===== -->
  <div class="halaman" id="halamanTambah">
     <form id="formKegiatan">
      <label for="namaKegiatan">Nama kegiatan</label>
      <input type="text" id="namaKegiatan" placeholder="Contoh: Meeting dengan klien" required>

      <label for="tanggal">Tanggal</label>
      <input type="date" id="tanggal" required>s

      <label for="kategori">Kategori</label>
      <select id="kategori"></select>
      <p class="info-jendela" id="hintKategori"></p>

      <label for="prioritas">Prioritas</label>
      <select id="prioritas">
        <option value="otomatis" selected>Otomatis (tebak dari nama & kategori)</option>
        <option value="tinggi">Tinggi</option>
        <option value="sedang">Sedang</option>
        <option value="rendah">Rendah</option>
      </select>
      <p class="info-jendela" id="hintPrioritas"></p>

      <label for="tipe">Jenis kegiatan</label>
      <select id="tipe">
        <option value="tetap">Jam tetap (aku tentukan jamnya)</option>
        <option value="fleksibel">Fleksibel (sistem yang cari jamnya)</option>
      </select>

      <div class="grup" id="grupTetap">
        <label for="jamMulai">Jam mulai</label>
        <input type="time" id="jamMulai">
        <label for="jamSelesai">Jam selesai</label>
        <input type="time" id="jamSelesai">
      </div>

      <div class="grup" id="grupFleksibel">
        <label for="durasi">Durasi (menit)</label>
        <input type="number" id="durasi" min="5" step="5" placeholder="Contoh: 90">
        <p class="info-jendela" id="infoJendela"></p>
      </div>

      <button type="submit" id="tombolSubmit">Tambah Kegiatan</button>
    </form>

    <div class="kotak-pengingat">
      <div class="baris">
        <label for="pengingat">🔔 Pengingat</label>
        <select id="pengingat">
          <option value="mati">Mati</option>
          <option value="5">5 menit sebelum mulai</option>
          <option value="10">10 menit sebelum mulai</option>
          <option value="15">15 menit sebelum mulai</option>
          <option value="30">30 menit sebelum mulai</option>
          <option value="60">1 jam sebelum mulai</option>
        </select>
      </div>
      <div class="baris">
        <button type="button" class="chip" id="btnIzin">Aktifkan notifikasi</button>
      </div>
      <p class="info-jendela" id="statusNotif"></p>
    </div>
  </div>

  <!-- ===== HALAMAN 2: KALENDER ===== -->
  <div class="halaman aktif" id="halamanKalender">
    <div class="kepala">
      <button type="button" class="btn-panah" id="btnPrev" title="Minggu sebelumnya" aria-label="Minggu sebelumnya">‹</button>
      <b id="judulBulan"></b>
      <button type="button" class="btn-panah" id="btnNext" title="Minggu berikutnya" aria-label="Minggu berikutnya">›</button>
    </div>
    <div class="strip" id="strip"></div>

  <script>
    const JAM_AWAL_HARI = "06:00";
    const JAM_AKHIR_HARI = "22:00";
    const PX_PER_MENIT = 1.2;

    const KATEGORI = {
      kerja:    { nama: 'Kerja',    warna: '#8e44ad' },
      belajar:  { nama: 'Belajar',  warna: '#3498db' },
      olahraga: { nama: 'Olahraga', warna: '#e67e22' },
      pribadi:  { nama: 'Pribadi',  warna: '#16a085' },
      lainnya:  { nama: 'Lainnya',  warna: '#7f8c8d' }
    };

    const KATA_KUNCI = {
      kerja:    ['kerja', 'meeting', 'rapat', 'kantor', 'klien', 'presentasi', 'proyek', 'project', 'deadline', 'laporan', 'email', 'interview'],
      belajar:  ['belajar', 'kuliah', 'kelas', 'tugas', 'ujian', 'kursus', 'baca', 'riset', 'skripsi', 'bimbel', 'study', 'learn'],
      olahraga: ['olahraga', 'gym', 'lari', 'jogging', 'renang', 'yoga', 'futsal', 'badminton', 'sepeda', 'senam', 'workout', 'fitness', 'bola'],
      pribadi:  ['makan', 'mandi', 'tidur', 'istirahat', 'keluarga', 'teman', 'nonton', 'hobi', 'belanja', 'santai', 'ibadah', 'sholat', 'salat', 'doa', 'masak', 'bermain', 'jalan']
    };

    const KATA_KUNCI_PRIORITAS = {
      tinggi: ['deadline', 'ujian', 'urgent', 'penting', 'darurat', 'wajib', 'presentasi', 'interview', 'sidang', 'meeting', 'rapat', 'klien', 'dokter', 'bayar', 'tagihan'],
      rendah: ['nonton', 'santai', 'main', 'game', 'rebahan', 'hobi', 'opsional', 'nanti', 'scroll']
    };

    const PRIORITAS_KATEGORI = { kerja: 'tinggi', belajar: 'sedang', olahraga: 'sedang', pribadi: 'rendah', lainnya: 'sedang' };
    const BOBOT_PRIORITAS = { tinggi: 0, sedang: 1, rendah: 2 };
    const NAMA_PRIORITAS = { tinggi: 'Tinggi', sedang: 'Sedang', rendah: 'Rendah' };

    const IKON = { kerja: '💼', belajar: '📚', olahraga: '🏃', pribadi: '🏠', lainnya: '📌' };
    const WARNA_PRI = { tinggi: '#ea4335', sedang: '#f9ab00', rendah: '#34a853' };

    function adaKataKunci(nama, daftar) {
      const kata = nama.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      return kata.some(k => daftar.some(kw => k.startsWith(kw)));
    }
    function tebakKategori(nama) {
      for (const kode of Object.keys(KATA_KUNCI)) {
        if (adaKataKunci(nama, KATA_KUNCI[kode])) return kode;
      }
      return 'lainnya';
    }
    function tebakPrioritas(nama, kategori) {
      if (adaKataKunci(nama, KATA_KUNCI_PRIORITAS.tinggi)) return 'tinggi';
      if (adaKataKunci(nama, KATA_KUNCI_PRIORITAS.rendah)) return 'rendah';
      return PRIORITAS_KATEGORI[kategori] || 'sedang';
    }

    function formatISO(dt) {
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
    function hariIni() { return formatISO(new Date()); }
    function geserTanggal(tgl, n) {
      const [y, m, d] = tgl.split('-').map(Number);
      return formatISO(new Date(y, m - 1, d + n));
    }
    function namaTanggal(tgl) {
      const [y, m, d] = tgl.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function namaBulan(tgl) {
      const [y, m, d] = tgl.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyDrnuoOBpdtFtp1Vy52pp28Web-NK-wA7M",
      authDomain: "jadwal-otomatis-954b7.firebaseapp.com",
      projectId: "jadwal-otomatis-954b7",
      storageBucket: "jadwal-otomatis-954b7.firebasestorage.app",
      messagingSenderId: "325470252976",
      appId: "1:325470252976:web:d442365eba2b6e354b7075"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let kegiatanRef = null; // diisi setelah user login

    const $ = (id) => document.getElementById(id);
    const form = $('formKegiatan'), hasilDiv = $('hasilJadwal'), tombolSubmit = $('tombolSubmit');
    const namaInput = $('namaKegiatan'), tanggalInput = $('tanggal'), tipeSelect = $('tipe');
    const kategoriSelect = $('kategori'), hintKategori = $('hintKategori');
    const prioritasSelect = $('prioritas'), hintPrioritas = $('hintPrioritas');
    const grupTetap = $('grupTetap'), grupFleksibel = $('grupFleksibel');
    const jamMulaiInput = $('jamMulai'), jamSelesaiInput = $('jamSelesai'), durasiInput = $('durasi');
    const stripDiv = $('strip'), judulBulan = $('judulBulan');
    const btnHariIni = $('btnHariIni'), btnSemua = $('btnSemua');
    const btnTimeline = $('btnTimeline'), btnDaftar = $('btnDaftar');
    const sheet = $('sheet'), sheetLatar = $('sheetLatar');

    let idKegiatanAkanDihapus = null;

    const modalHapusLatar = $('modalHapusLatar');
    const namaKegiatanHapus = $('namaKegiatanHapus');
    const btnKonfirmasiHapus = $('btnKonfirmasiHapus');

    const pengingatSelect = $('pengingat'), btnIzin = $('btnIzin'), statusNotif = $('statusNotif');

    const popupJadwalLatar = $('popupJadwalLatar');
    const popupJadwalPesan = $('popupJadwalPesan');
    const popupJadwalJam = $('popupJadwalJam');
    const btnTutupPopupJadwal = $('btnTutupPopupJadwal');

    function tutupPopupJadwal() {
      popupJadwalLatar.classList.remove('tampil');
    }

btnTutupPopupJadwal.addEventListener('click', tutupPopupJadwal);

    // ===== NAVIGASI 2 HALAMAN/MENU =====
      function gantiHalaman(nama) {
      const tambah = nama === 'tambah';
      $('halamanTambah').classList.toggle('aktif', tambah);
      $('halamanKalender').classList.toggle('aktif', !tambah);
      $('btnHalTambah').classList.toggle('aktif', tambah);
      $('btnHalKalender').classList.toggle('aktif', !tambah);
      $('btnHalTambah').setAttribute('aria-current', tambah ? 'page' : 'false');
      $('btnHalKalender').setAttribute('aria-current', tambah ? 'false' : 'page');
      window.scrollTo(0, 0);
    }
    // ===== akhir navigasi =====

    $('infoJendela').textContent =
      'Sistem mencari waktu kosong antara ' + JAM_AWAL_HARI + ' dan ' + JAM_AKHIR_HARI +
      '. Prioritas tinggi ditempatkan lebih dulu (dapat jam paling awal).';

    const opsiOtomatis = document.createElement('option');
    opsiOtomatis.value = 'otomatis';
    opsiOtomatis.textContent = 'Otomatis (tebak dari nama)';
    kategoriSelect.appendChild(opsiOtomatis);

    Object.keys(KATEGORI).forEach(kode => {
      const opsi = document.createElement('option');
      opsi.value = kode;
      opsi.textContent = KATEGORI[kode].nama;
      kategoriSelect.appendChild(opsi);

      const item = document.createElement('span');
      item.textContent = KATEGORI[kode].nama;
      item.style.setProperty('--warna', KATEGORI[kode].warna);
      $('legenda').appendChild(item);
    });
    kategoriSelect.value = 'otomatis';

    function kategoriTerpilih(nama) {
      return kategoriSelect.value === 'otomatis' ? tebakKategori(nama) : kategoriSelect.value;
    }

    function updateHint() {
      const nama = namaInput.value.trim();
      hintKategori.textContent = kategoriSelect.value !== 'otomatis' ? ''
        : nama ? 'Terdeteksi: ' + KATEGORI[tebakKategori(nama)].nama : 'Kategori akan ditebak dari nama kegiatan.';
      hintPrioritas.textContent = prioritasSelect.value !== 'otomatis' ? ''
        : nama ? 'Terdeteksi: Prioritas ' + NAMA_PRIORITAS[tebakPrioritas(nama, kategoriTerpilih(nama))]
        : 'Prioritas akan ditebak dari nama dan kategori kegiatan.';
    }
    namaInput.addEventListener('input', updateHint);
    kategoriSelect.addEventListener('change', updateHint);
    prioritasSelect.addEventListener('change', updateHint);
    updateHint();

    let daftarKegiatan = [];
    let hasilTersusun = [];
    let sedangEdit = null;
    let dataSiap = false;
    let filterTanggal = hariIni();
    let tampilan = 'timeline';
    let sedangDitulisKunci = new Set(); // id yang lagi proses dikunci ke Firestore, biar gak double-tulis

    function setFilter(tgl) {
      filterTanggal = tgl;
      btnSemua.classList.toggle('aktif', tgl === null);
      btnHariIni.classList.toggle('aktif', tgl === hariIni());
      if (tgl && sedangEdit === null) tanggalInput.value = tgl;
      tampilkanJadwal();
    }

    function setTampilan(mode) {
      tampilan = mode;
      btnTimeline.classList.toggle('aktif', mode === 'timeline');
      btnDaftar.classList.toggle('aktif', mode === 'daftar');
      tampilkanJadwal();
    }

    function renderStrip() {
      const acuan = filterTanggal || hariIni();
      const [y, m, d] = acuan.split('-').map(Number);
      const urutanHari = (new Date(y, m - 1, d).getDay() + 6) % 7;
      const senin = geserTanggal(acuan, -urutanHari);

      judulBulan.textContent = namaBulan(acuan);
      stripDiv.innerHTML = '';
      ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].forEach((nm, i) => {
        const tgl = geserTanggal(senin, i);
        const ada = daftarKegiatan.some(k => k.tanggal === tgl);
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'hari' + (tgl === filterTanggal ? ' pilih' : '') + (tgl === hariIni() ? ' ini' : '');
        el.innerHTML = '<small>' + nm + '</small><b>' + Number(tgl.slice(8)) + '</b><i class="' + (ada ? 'titik' : '') + '"></i>';
        el.onclick = () => setFilter(tgl);
        stripDiv.appendChild(el);
      });
    }

    btnHariIni.addEventListener('click', () => setFilter(hariIni()));
    btnSemua.addEventListener('click', () => setFilter(null));
    $('btnPrev').addEventListener('click', () => setFilter(geserTanggal(filterTanggal || hariIni(), -7)));
    $('btnNext').addEventListener('click', () => setFilter(geserTanggal(filterTanggal || hariIni(), 7)));
    btnTimeline.addEventListener('click', () => setTampilan('timeline'));
    btnDaftar.addEventListener('click', () => setTampilan('daftar'));

    function bacaSimpan(k, def) {
      try { const v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; }
    }
    function tulisSimpan(k, v) {
      try { localStorage.setItem(k, v); } catch (e) {}
    }

    pengingatSelect.value = bacaSimpan('pengingatMenit', '10');
    if (!pengingatSelect.value) pengingatSelect.value = '10';
    pengingatSelect.addEventListener('change', () => {
      tulisSimpan('pengingatMenit', pengingatSelect.value);
      cekPengingat();
    });

    let sudahNotif = new Set();
    try { sudahNotif = new Set(JSON.parse(bacaSimpan('sudahNotif', '[]'))); } catch (e) {}
    function tandaiNotif(kunci) {
      sudahNotif.add(kunci);
      sudahNotif = new Set([...sudahNotif].filter(k => k.startsWith(hariIni())));
      tulisSimpan('sudahNotif', JSON.stringify([...sudahNotif]));
    }

    let swReg = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
    }

    function tampilToast(teks) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = teks;
      t.onclick = () => t.remove();
      $('toastArea').appendChild(t);
      setTimeout(() => t.remove(), 9000);
    }

    function updateStatusNotif() {
      if (!('Notification' in window)) {
        btnIzin.style.display = 'none';
        statusNotif.textContent = 'Browser ini tidak mendukung notifikasi sistem. Pengingat tetap tampil di dalam halaman.';
        return;
      }
      const izin = Notification.permission;
      if (izin === 'granted') {
        btnIzin.style.display = '';
        btnIzin.textContent = 'Tes notifikasi';
        statusNotif.textContent = 'Notifikasi aktif. Halaman ini harus tetap terbuka agar pengingat muncul.';
      } else if (izin === 'denied') {
        btnIzin.style.display = 'none';
        statusNotif.textContent = 'Notifikasi diblokir browser. Izinkan lewat ikon gembok di address bar. Sementara itu pengingat tetap tampil di dalam halaman.';
      } else {
        btnIzin.style.display = '';
        btnIzin.textContent = 'Aktifkan notifikasi';
        statusNotif.textContent = 'Belum diizinkan. Tekan tombol untuk mengaktifkan notifikasi sistem.';
      }
    }

    btnIzin.addEventListener('click', async () => {
      if (Notification.permission === 'granted') {
        kirimNotif('Tes pengingat', 'Notifikasi berfungsi dengan baik.', 'tes-' + Date.now());
        return;
      }
      try { await Notification.requestPermission(); } catch (e) {}
      updateStatusNotif();
    });
    updateStatusNotif();

    async function kirimNotif(judul, isi, tag) {
      const bisaSistem = ('Notification' in window) && Notification.permission === 'granted';

      if (document.visibilityState === 'visible' || !bisaSistem) {
        tampilToast('🔔 ' + judul + ' — ' + isi);
      }
      if (!bisaSistem) return;

      try {
        const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
        if (reg) { await reg.showNotification(judul, { body: isi, tag: tag }); return; }
      } catch (e) {}
      try { new Notification(judul, { body: isi, tag: tag }); } catch (e) {}
    }

    function cekPengingat() {
      if (!dataSiap || pengingatSelect.value === 'mati') return;

      const sebelum = parseInt(pengingatSelect.value, 10);
      const skrg = new Date();
      const menitSkrg = skrg.getHours() * 60 + skrg.getMinutes();
      const tglHariIni = hariIni();

      hasilTersusun.forEach(keg => {
        if (keg.tanggal !== tglHariIni || keg.tidakMuat || keg.tuntas) return;
        const selisih = keMenit(keg.mulai) - menitSkrg;

        if (selisih > 0 && selisih <= sebelum) {
          const kunci = tglHariIni + '|' + keg.id + '|' + keg.mulai + '|sebelum';
          if (!sudahNotif.has(kunci)) {
            tandaiNotif(kunci);
            kirimNotif(keg.nama, 'Mulai ' + selisih + ' menit lagi (' + keg.mulai + ')', kunci);
          }
        } else if (selisih <= 0 && selisih > -5) {
          const kunci = tglHariIni + '|' + keg.id + '|' + keg.mulai + '|mulai';
          if (!sudahNotif.has(kunci)) {
            tandaiNotif(kunci);
            kirimNotif(keg.nama, 'Waktunya mulai sekarang (' + keg.mulai + ')', kunci);
          }
        }
      });
    }

    setInterval(cekPengingat, 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') cekPengingat();
    });

    firebase.auth().signInAnonymously().catch((error) => {
      console.error('Gagal login anonim:', error);
      hasilDiv.innerHTML = '<p>Gagal terhubung ke server. Coba refresh halaman.</p>';
    });

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;

      // Tiap user punya "laci" sendiri: users/{uid}/kegiatan
      kegiatanRef = db.collection('users').doc(user.uid).collection('kegiatan');

      kegiatanRef.onSnapshot((snapshot) => {
        daftarKegiatan = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        dataSiap = true;
        tampilkanJadwal();
        cekPengingat();
      }, (error) => {
        console.error('Gagal membaca data:', error);
        hasilDiv.innerHTML = '<p>Gagal memuat data. Coba refresh halaman.</p>';
      });
    });

    function ubahTipe() {
      const tetap = tipeSelect.value === 'tetap';
      grupTetap.style.display = tetap ? 'flex' : 'none';
      grupFleksibel.style.display = tetap ? 'none' : 'flex';
      jamMulaiInput.required = tetap;
      jamSelesaiInput.required = tetap;
      durasiInput.required = !tetap;
    }
    tipeSelect.addEventListener('change', ubahTipe);
    ubahTipe();

    function resetForm() {
      form.reset();
      kategoriSelect.value = 'otomatis';
      prioritasSelect.value = 'otomatis';
      tanggalInput.value = filterTanggal || '';
      ubahTipe();
      updateHint();
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      if (!kegiatanRef) {
      tampilToast('⏳ Masih menghubungkan ke server, coba lagi sebentar.');
      return;
    }

      const tipe = tipeSelect.value;
      const nama = namaInput.value;
      const kategoriAuto = kategoriSelect.value === 'otomatis';
      const kategoriFinal = kategoriTerpilih(nama);
      const prioritasAuto = prioritasSelect.value === 'otomatis';
      const prioritasFinal = prioritasAuto ? tebakPrioritas(nama, kategoriFinal) : prioritasSelect.value;

      const dataForm = {
        nama: nama,
        tanggal: tanggalInput.value,
        kategori: kategoriFinal,
        kategoriAuto: kategoriAuto,
        prioritas: prioritasFinal,
        prioritasAuto: prioritasAuto,
        tipe: tipe
      };

      if (tipe === 'tetap') {
        if (jamSelesaiInput.value <= jamMulaiInput.value) {
          tampilToast('⚠️ Jam selesai harus lebih besar dari jam mulai.');
          return;
        }
        dataForm.jamMulai = jamMulaiInput.value;
        dataForm.jamSelesai = jamSelesaiInput.value;
      } else {
        const durasi = parseInt(durasiInput.value, 10);
        if (!durasi || durasi < 5) {
          tampilToast('⚠️ Durasi minimal 5 menit.');
          return;
        }
        dataForm.durasi = durasi;
      }

      if (sedangEdit === null) {
        dataForm.dibuat = Date.now();
        dataForm.tuntas = false;
        kegiatanRef.add(dataForm);
      } else {
        const lama = daftarKegiatan.find(k => k.id === sedangEdit);
        dataForm.dibuat = (lama && lama.dibuat) || Date.now();
        dataForm.tuntas = (lama && lama.tuntas) || false;
        // Hapus kunci jam fleksibel lama, supaya posisi dihitung ulang dari awal setelah diedit
        dataForm.terjadwalMulai = firebase.firestore.FieldValue.delete();
        dataForm.terjadwalSelesai = firebase.firestore.FieldValue.delete();
        kegiatanRef.doc(sedangEdit).update(dataForm);
        sedangEdit = null;
        tombolSubmit.textContent = 'Tambah Kegiatan';
      }

      resetForm();
      if (filterTanggal !== null) setFilter(dataForm.tanggal);
      gantiHalaman('kalender'); // langsung pindah ke halaman Kalender setelah simpan
    });

    async function jadwalkanUlang(id) {
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;

      if (keg.tipe !== 'fleksibel') {
        tampilToast('⚠️ Jadwalkan Ulang hanya untuk kegiatan fleksibel.');
        return;
      }

      const jadwalSekarang = hasilTersusun.find(k => k.id === id);

      if (!jadwalSekarang || jadwalSekarang.tidakMuat) {
        tampilToast('⚠️ Kegiatan ini belum punya jadwal yang bisa dijadwal ulang.');
        return;
      }

      const durasi = Number(keg.durasi);

      if (!durasi || durasi <= 0) {
        tampilToast('⚠️ Durasi kegiatan tidak valid.');
        return;
      }

      const tanggal = keg.tanggal;
      const mulaiLama = keMenit(jadwalSekarang.mulai);

      // Ambil jadwal kegiatan lain.
      // Jadwal mereka TIDAK akan diubah.
      const kegiatanLain = hasilTersusun
        .filter(k => k.id !== id)
        .filter(k => k.tanggal === tanggal)
        .filter(k => !k.tidakMuat)
        .filter(k => k.mulai && k.selesai)
        .map(k => ({
          mulai: keMenit(k.mulai),
          selesai: keMenit(k.selesai)
        }))
        .sort((a, b) => a.mulai - b.mulai);

      // Mulai mencari slot setelah posisi lama.
      let calonMulai = mulaiLama + PEMBULATAN_MENIT;
      let slotDitemukan = null;

      for (const jadwal of kegiatanLain) {
        if (jadwal.selesai <= calonMulai) {
          continue;
        }

        if (jadwal.mulai > calonMulai) {
          const durasiSlot = jadwal.mulai - calonMulai;

          if (durasiSlot >= durasi) {
            slotDitemukan = calonMulai;
            break;
          }
        }

        calonMulai = Math.max(calonMulai, jadwal.selesai);
      }

      if (slotDitemukan === null) {
        if (calonMulai + durasi <= keMenit(JAM_AKHIR_HARI)) {
          slotDitemukan = calonMulai;
        }
      }

      if (slotDitemukan === null) {
        tampilToast('⚠️ Tidak ada slot kosong berikutnya hari ini.');
        return;
      }

      const mulaiBaru = keJam(slotDitemukan);
      const selesaiBaru = keJam(slotDitemukan + durasi);

      try {
        // Hanya kegiatan yang dipilih yang diubah.
        await kegiatanRef.doc(id).update({
          terjadwalMulai: mulaiBaru,
          terjadwalSelesai: selesaiBaru
        });

        // Jangan memanggil susunJadwal() secara manual di sini.
        // Kegiatan lain tetap menggunakan jadwalnya masing-masing.

        tutupSheet();

        popupJadwalPesan.textContent =
          'Kegiatan ' + keg.nama + ' berhasil dijadwalkan ulang.';

        popupJadwalJam.textContent =
          mulaiBaru + ' - ' + selesaiBaru;

        popupJadwalLatar.classList.add('tampil');

      } catch (error) {
        console.error(error);
        tampilToast('❌ Gagal menjadwalkan ulang kegiatan.');
      }
    }

    function hapusKegiatan(id) {
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;

      idKegiatanAkanDihapus = id;
      namaKegiatanHapus.textContent = keg.nama;
      modalHapusLatar.classList.add('tampil');
    }
    
    function editKegiatan(id) {
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;
      tutupSheet();

      namaInput.value = keg.nama;
      tanggalInput.value = keg.tanggal;
      kategoriSelect.value = keg.kategoriAuto ? 'otomatis' : (keg.kategori || 'lainnya');
      prioritasSelect.value = (keg.prioritasAuto || !keg.prioritas) ? 'otomatis' : keg.prioritas;
      tipeSelect.value = keg.tipe || 'tetap';
      ubahTipe();
      updateHint();

      if (tipeSelect.value === 'tetap') {
        jamMulaiInput.value = keg.jamMulai;
        jamSelesaiInput.value = keg.jamSelesai;
      } else {
        durasiInput.value = keg.durasi;
      }

      sedangEdit = id;
      tombolSubmit.textContent = 'Simpan Perubahan';
      gantiHalaman('tambah'); // pindah ke halaman form supaya user bisa langsung edit
    }

    function toggleSelesai(id, event) {
      if (event) event.stopPropagation();
      const keg = daftarKegiatan.find(k => k.id === id);
      if (!keg) return;
      kegiatanRef.doc(id).update({ tuntas: !keg.tuntas });
    }

    function keMenit(jam) {
      const [j, m] = jam.split(':').map(Number);
      return j * 60 + m;
    }
    function keJam(menit) {
      return String(Math.floor(menit / 60)).padStart(2, '0') + ':' + String(menit % 60).padStart(2, '0');
    }

    const PEMBULATAN_MENIT = 5;
    function menitSekarangBulat() {
      const skrg = new Date();
      const menit = skrg.getHours() * 60 + skrg.getMinutes();
      return Math.ceil(menit / PEMBULATAN_MENIT) * PEMBULATAN_MENIT;
    }

    function esc(teks) {
      const el = document.createElement('div');
      el.textContent = teks;
      return el.innerHTML;
    }
    function kategoriKegiatan(keg) {
      return KATEGORI[keg.kategori] ? keg.kategori : tebakKategori(keg.nama);
    }
    function prioritasKegiatan(keg) {
      return BOBOT_PRIORITAS[keg.prioritas] !== undefined ? keg.prioritas : tebakPrioritas(keg.nama, kategoriKegiatan(keg));
    }

    function kegiatanLewat(keg) {
      if (keg.tidakMuat) return false;
      const tglIni = hariIni();
      if (keg.tanggal < tglIni) return true;
      if (keg.tanggal > tglIni) return false;
      const skrg = new Date();
      return keMenit(keg.selesai) <= (skrg.getHours() * 60 + skrg.getMinutes());
    }

    function susunJadwal(daftar) {
      const perTanggal = {};
      daftar.forEach(k => { (perTanggal[k.tanggal] = perTanggal[k.tanggal] || []).push(k); });
      const hasil = [];
      const menitSkrgSkr = new Date().getHours() * 60 + new Date().getMinutes();

      Object.keys(perTanggal).sort().forEach(tgl => {
        const items = perTanggal[tgl];
        const iniHariIni = tgl === hariIni();

        // Kegiatan fleksibel yang sudah pernah dikunci (tersimpan permanen di
        // Firestore lewat field terjadwalMulai/terjadwalSelesai) diperlakukan
        // seperti kegiatan jam tetap, tidak pernah dihitung ulang lagi. Ini
        // yang mencegah blok "lari" mengejar garis waktu berjalan.
        const fleksibelTerkunci = items
          .filter(k => k.tipe === 'fleksibel' && k.terjadwalMulai)
          .map(k => ({ ...k, mulai: k.terjadwalMulai, selesai: k.terjadwalSelesai }));

        const fleksibelBelum = items.filter(k => k.tipe === 'fleksibel' && !k.terjadwalMulai);

        const tetap = items
          .filter(k => (k.tipe || 'tetap') === 'tetap')
          .map(k => ({ ...k, mulai: k.jamMulai, selesai: k.jamSelesai }))
          .concat(fleksibelTerkunci)
          .sort((a, b) => keMenit(a.mulai) - keMenit(b.mulai));

        const fleksibel = fleksibelBelum.sort((a, b) => {
          const sel = BOBOT_PRIORITAS[prioritasKegiatan(a)] - BOBOT_PRIORITAS[prioritasKegiatan(b)];
          return sel !== 0 ? sel : (a.dibuat || 0) - (b.dibuat || 0);
        });

        const slotKosong = [];
        const batasAkhir = keMenit(JAM_AKHIR_HARI);
        let pointer = keMenit(JAM_AWAL_HARI);
        if (iniHariIni) pointer = Math.max(pointer, menitSekarangBulat());
        tetap.forEach(k => {
          const akhirSlot = Math.min(keMenit(k.mulai), batasAkhir);
          if (akhirSlot > pointer) slotKosong.push({ mulai: pointer, selesai: akhirSlot });
          pointer = Math.max(pointer, keMenit(k.selesai));
        });
        if (pointer < batasAkhir) slotKosong.push({ mulai: pointer, selesai: batasAkhir });

        const terpasang = fleksibel.map(k => {
          const slot = slotKosong.find(s => s.selesai - s.mulai >= k.durasi);
          if (!slot) return { ...k, tidakMuat: true };
          const mulai = slot.mulai;
          slot.mulai += k.durasi;
          return { ...k, mulai: keJam(mulai), selesai: keJam(mulai + k.durasi) };
        });

        const berjam = [...tetap, ...terpasang.filter(k => !k.tidakMuat)]
          .sort((a, b) => keMenit(a.mulai) - keMenit(b.mulai));

        let akhirTerjauh = -1;
        berjam.forEach(k => {
          k.bentrok = keMenit(k.mulai) < akhirTerjauh;
          akhirTerjauh = Math.max(akhirTerjauh, keMenit(k.selesai));
        });

        // Begitu jam mulai kegiatan fleksibel sudah tiba, kunci permanen ke
        // Firestore supaya tidak dihitung ulang lagi di refresh/device manapun
        if (iniHariIni) {
          berjam.forEach(k => {
            const sudahMulai = keMenit(k.mulai) <= menitSkrgSkr;
            if (k.tipe === 'fleksibel' && sudahMulai && !k.terjadwalMulai && !sedangDitulisKunci.has(k.id)) {
              sedangDitulisKunci.add(k.id);
              kegiatanRef.doc(k.id).update({ terjadwalMulai: k.mulai, terjadwalSelesai: k.selesai })
                .catch(() => {})
                .finally(() => sedangDitulisKunci.delete(k.id));
            }
          });
        }

        hasil.push(...berjam, ...terpasang.filter(k => k.tidakMuat));
      });

      hasil.forEach(k => { k.lewat = kegiatanLewat(k); });
      return hasil;
    }

    function bukaSheet(id) {
      const keg = hasilTersusun.find(k => k.id === id);
      if (!keg) return;
      const kode = kategoriKegiatan(keg);
      const jam = keg.tidakMuat ? 'Tidak muat di hari ini (' + keg.durasi + ' menit)' : keg.mulai + ' - ' + keg.selesai;
      const kelasCentang = 'centang' + (keg.tuntas ? ' terisi' : (keg.lewat ? ' lewat-belum' : ''));

      sheet.innerHTML =
        '<div class="kepala-sheet"><div>' +
          '<h3>' + esc(keg.nama) + '</h3>' +
          '<p>' + namaTanggal(keg.tanggal) + '</p>' +
        '</div>' +
        '<button class="' + kelasCentang + '" title="Tandai selesai" onclick="toggleSelesai(\'' + keg.id + '\', event)">' + (keg.tuntas ? '✓' : '') + '</button>' +
        '</div>' +
        '<p><b>' + jam + '</b></p>' +
        '<p><span class="titik-kat" style="background:' + KATEGORI[kode].warna + '"></span>' +
          KATEGORI[kode].nama + (keg.kategoriAuto ? ' (otomatis)' : '') + '</p>' +
        '<p>Prioritas ' + NAMA_PRIORITAS[prioritasKegiatan(keg)] + (keg.prioritasAuto ? ' (otomatis)' : '') + '</p>' +
        (keg.tipe === 'fleksibel' && !keg.tidakMuat ? '<p style="color:#00d4ff">Jam diatur otomatis oleh sistem' + (keg.terjadwalMulai ? ' (sudah terkunci)' : '') + '</p>' : '') +
        (keg.bentrok ? '<p style="color:#ff5d73">⚠️ Bentrok dengan kegiatan lain</p>' : '') +
        (keg.lewat && !keg.tuntas ? '<p style="color:#ff5d73">Jadwal ini sudah lewat dan belum ditandai selesai</p>' : '') +
        (keg.tuntas ? '<p style="color:#34d399">✓ Sudah ditandai selesai</p>' : '') +
        '<div class="tombol-aksi">' +
           '<button class="btn-edit" onclick="editKegiatan(\'' + keg.id + '\')">Edit</button>' +
           '<button class="btn-jadwal-ulang" onclick="jadwalkanUlang(\'' + keg.id + '\')">↻ Jadwalkan Ulang</button>' +
           '<button class="btn-hapus" onclick="hapusKegiatan(\'' + keg.id + '\')">Hapus</button>' +
           '<button class="btn-tutup" onclick="tutupSheet()">Tutup</button>' +
        '</div>';
      sheet.classList.add('tampil');
      sheetLatar.classList.add('tampil');
    }

    function tutupSheet() {
      sheet.classList.remove('tampil');
      sheetLatar.classList.remove('tampil');
      modalHapusLatar.classList.remove('tampil');
    }

    function tutupModalHapus() {
      idKegiatanAkanDihapus = null;
      modalHapusLatar.classList.remove('tampil');
    }

    sheetLatar.addEventListener('click', tutupSheet);

    function buatJudul(tgl) {
      const judul = document.createElement('h3');
      judul.className = 'tanggal-judul';
      judul.textContent = namaTanggal(tgl);
      return judul;
    }

    function buatKartu(keg) {
      const fleks = keg.tipe === 'fleksibel';
      const kode = kategoriKegiatan(keg);
      const kelasCentang = 'centang' + (keg.tuntas ? ' terisi' : (keg.lewat ? ' lewat-belum' : ''));

      const div = document.createElement('div');
      div.className = 'kegiatan' +
        (keg.bentrok ? ' bentrok' : '') + (keg.tidakMuat ? ' tidak-muat' : '') +
        (keg.lewat ? ' lewat' : '') + (keg.tuntas ? ' selesai' : '');
      div.style.borderLeftColor = KATEGORI[kode].warna;
      div.innerHTML = `
        <button class="${kelasCentang}" title="Tandai selesai" onclick="toggleSelesai('${keg.id}', event)">${keg.tuntas ? '✓' : ''}</button>
        <div class="isi-kartu">
          <strong class="judul-kartu">${esc(keg.nama)}</strong><br>
          ${keg.tidakMuat ? 'Tidak muat di hari ini (' + keg.durasi + ' menit). Coba pindah tanggal atau kurangi durasi.' : keg.mulai + ' - ' + keg.selesai}<br>
          <span class="meta">${KATEGORI[kode].nama}${keg.kategoriAuto ? ' (otomatis)' : ''} | Prioritas ${NAMA_PRIORITAS[prioritasKegiatan(keg)]}${keg.prioritasAuto ? ' (otomatis)' : ''}</span>
          ${fleks && !keg.tidakMuat ? '<br><span class="label-otomatis">Diatur otomatis, ' + keg.durasi + ' menit</span>' : ''}
          ${keg.bentrok ? '<br>⚠️ Bentrok dengan kegiatan lain!' : ''}
          <div class="tombol-aksi">
            <button class="btn-edit" onclick="editKegiatan('${keg.id}')">Edit</button>
            <button class="btn-hapus" onclick="hapusKegiatan('${keg.id}')">Hapus</button>
          </div>
        </div>`;
      return div;
    }

    function aturKolom(daftar) {
      let kelompok = [], akhirKelompok = -1;
      const tutup = () => {
        const n = Math.max(...kelompok.map(k => k._kol)) + 1;
        kelompok.forEach(k => { k._n = n; });
        kelompok = [];
      };
      daftar.forEach(k => {
        const mulai = keMenit(k.mulai);
        if (kelompok.length && mulai >= akhirKelompok) { tutup(); akhirKelompok = -1; }
        const terpakai = kelompok.filter(c => keMenit(c.selesai) > mulai).map(c => c._kol);
        let kol = 0;
        while (terpakai.includes(kol)) kol++;
        k._kol = kol;
        kelompok.push(k);
        akhirKelompok = Math.max(akhirKelompok, keMenit(k.selesai));
      });
      if (kelompok.length) tutup();
    }

    function renderTimeline(daftar, tgl) {
      const berjam = daftar.filter(k => !k.tidakMuat);
      const tidakMuat = daftar.filter(k => k.tidakMuat);

      if (berjam.length) {
        let awal = keMenit(JAM_AWAL_HARI), akhir = keMenit(JAM_AKHIR_HARI);
        berjam.forEach(k => {
          awal = Math.min(awal, keMenit(k.mulai));
          akhir = Math.max(akhir, keMenit(k.selesai));
        });
        awal = Math.floor(awal / 60) * 60;
        akhir = Math.ceil(akhir / 60) * 60;
        const y = (m) => (m - awal) * PX_PER_MENIT;

        aturKolom(berjam);

        const wrap = document.createElement('div');
        wrap.className = 'timeline';
        wrap.style.height = y(akhir) + 'px';

        for (let m = awal; m <= akhir; m += 30) {
          const g = document.createElement('div');
          g.className = 'garis' + (m % 60 ? ' setengah' : '');
          g.style.top = y(m) + 'px';
          g.innerHTML = '<span>' + keJam(m) + '</span>';
          wrap.appendChild(g);
        }

        const tambahKosong = (dari, sampai) => {
          if (sampai - dari < 45) return;
          const jam = Math.floor((sampai - dari) / 60), mnt = (sampai - dari) % 60;
          const d = document.createElement('div');
          d.className = 'kosong';
          d.style.top = (y(dari) + 2) + 'px';
          d.style.height = ((sampai - dari) * PX_PER_MENIT - 4) + 'px';
          d.textContent = ('Kosong ' + (jam ? jam + ' j ' : '') + (mnt ? mnt + ' m' : '')).trim();
          wrap.appendChild(d);
        };
        const batas = keMenit(JAM_AKHIR_HARI);
        let kursor = keMenit(JAM_AWAL_HARI);
        berjam.forEach(k => {
          tambahKosong(kursor, Math.min(keMenit(k.mulai), batas));
          kursor = Math.max(kursor, keMenit(k.selesai));
        });
        tambahKosong(kursor, batas);

        berjam.forEach(keg => {
          const kode = kategoriKegiatan(keg);
          const warna = KATEGORI[kode].warna;
          const pri = prioritasKegiatan(keg);
          const mulai = keMenit(keg.mulai), selesai = keMenit(keg.selesai);
          const tinggi = (selesai - mulai) * PX_PER_MENIT;
          const tanda = (keg.tipe === 'fleksibel' ? ' ✦' : '') + (keg.bentrok ? ' ⚠️' : '');
          const judul = IKON[kode] + ' ' + esc(keg.nama) + tanda;
          const kelasCentang = 'centang' + (keg.tuntas ? ' terisi' : (keg.lewat ? ' lewat-belum' : ''));

          const blok = document.createElement('div');
          blok.className = 'blok' + (tinggi < 48 ? ' pendek' : '') +
            (keg.bentrok ? ' tabrak' : '') + (keg.lewat ? ' lewat' : '');
          blok.style.top = (y(mulai) + 1) + 'px';
          blok.style.height = Math.max(tinggi - 2, 24) + 'px';
          blok.style.left = 'calc(52px + (100% - 52px) * ' + keg._kol + ' / ' + keg._n + ')';
          blok.style.width = 'calc((100% - 52px) / ' + keg._n + ' - 4px)';
          blok.style.background = warna + '33';
          blok.style.borderLeftColor = warna;

          const tombolCentang = '<button class="' + kelasCentang + '" title="Tandai selesai" onclick="toggleSelesai(\'' + keg.id + '\', event)">' + (keg.tuntas ? '✓' : '') + '</button>';
          const warnaTitik = kode === 'lainnya' ? '#7f8c8d' : WARNA_PRI[pri];
          let isi = '<i class="pri" title="Prioritas ' + NAMA_PRIORITAS[pri] + '" style="background:' + warnaTitik + '"></i>' + tombolCentang;
          if (tinggi < 48) {
            isi += '<span class="judul">' + judul + '</span><span class="jam">' + keg.mulai + '</span>';
          } else {
            isi += '<div class="judul">' + judul + '</div>' +
              '<div class="jam">' + keg.mulai + ' - ' + keg.selesai + ' · ' + KATEGORI[kode].nama + ' · ' + NAMA_PRIORITAS[pri] + '</div>';
          }
          blok.innerHTML = isi;
          blok.setAttribute('role', 'button');
          blok.setAttribute('tabindex', '0');
          blok.setAttribute('aria-label', keg.nama + ', ' + keg.mulai + ' sampai ' + keg.selesai);
          blok.addEventListener('click', () => bukaSheet(keg.id));
          blok.addEventListener('keydown', (e) => {
            if (e.target !== blok) return;
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bukaSheet(keg.id); }
          });
          wrap.appendChild(blok);
        });

        if (tgl === hariIni()) {
          const skrg = new Date();
          const menitSkrg = skrg.getHours() * 60 + skrg.getMinutes();
          if (menitSkrg >= awal && menitSkrg <= akhir) {
            const g = document.createElement('div');
            g.className = 'sekarang';
            g.style.top = y(menitSkrg) + 'px';
            g.innerHTML = '<span>' + keJam(menitSkrg) + '</span>';
            wrap.appendChild(g);
          }
        }
        hasilDiv.appendChild(wrap);
      }

      tidakMuat.forEach(keg => hasilDiv.appendChild(buatKartu(keg)));
    }

    function tampilkanJadwal() {
      renderStrip();
      if (!dataSiap) return;

      hasilDiv.innerHTML = '';
      hasilTersusun = susunJadwal(daftarKegiatan);

      if (daftarKegiatan.length === 0) {
        hasilDiv.innerHTML = '<p>Belum ada kegiatan. Tambahkan lewat halaman "Tambah Kegiatan".</p>';
        return;
      }

      let daftar = filterTanggal ? hasilTersusun.filter(k => k.tanggal === filterTanggal) : hasilTersusun;

      if (daftar.length === 0) {
        hasilDiv.innerHTML =
          '<p>Belum ada kegiatan di ' + namaTanggal(filterTanggal) + '.</p>' +
          '<p class="info-jendela">Ada ' + daftarKegiatan.length + ' kegiatan di tanggal lain. Titik bercahaya di bawah angka tanggal menandai hari yang berisi kegiatan.</p>';
        return;
      }

      if (tampilan === 'timeline' && filterTanggal) {
        hasilDiv.appendChild(buatJudul(filterTanggal));
        renderTimeline(daftar, filterTanggal);
        return;
      }

      if (tampilan === 'timeline' && !filterTanggal) {
        hasilDiv.innerHTML = '<p class="info-jendela">Timeline hanya untuk satu tanggal. Pilih tanggal di atas, atau lihat semua kegiatan dalam daftar di bawah.</p>';
      }

      let tanggalTerakhir = null;
      daftar.forEach(keg => {
        if (keg.tanggal !== tanggalTerakhir) {
          hasilDiv.appendChild(buatJudul(keg.tanggal));
          tanggalTerakhir = keg.tanggal;
        }
        hasilDiv.appendChild(buatKartu(keg));
      });
    }

        document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        tutupSheet();
        tutupModalHapus();
        tutupPopupJadwal();
      });

    setTampilan('timeline');
    setFilter(hariIni());
    setInterval(tampilkanJadwal, 60000);

    btnKonfirmasiHapus.addEventListener('click', () => {
  if (!idKegiatanAkanDihapus) return;

  const id = idKegiatanAkanDihapus;

  kegiatanRef.doc(id).delete();

  tutupModalHapus();
  tutupSheet();
});
  </script>
